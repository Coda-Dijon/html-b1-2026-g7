<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  </head>
  <body>

  <header>

    <nav>
      <!-- Jekyll apporte une syntaxe supplémentaires pour faire des petites transformations -->
      <a href="{{ '/' | relative_url }}">Accueil</a>
      <a href="{{ '/CONSIGNES' | relative_url }}">Consignes</a>
      <a href="{{ '/contact' | relative_url }}">Contact</a>
    </nav>

  </header>

    <!-- le contenu de vos fichiers HTML ou md est injecté à l'intérieur de <main> -->
    <main>
      {{ content }}
    </main>

    <footer>
    Mon footer
      <!-- la variable peut être redéfinie dans chaque fichier (par par exemple dans contact.html) -->
      <p>{{ ma_variable }}</p>
    </footer>

  </body>
</html>
